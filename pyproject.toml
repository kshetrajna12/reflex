[project]
name = "reflex"
version = "0.1.0"
description = "A System One decision model (Jev-style) built on a pretrained Qwen: shared-state prefill, isolated question branches, direct probability readout."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kshetrajna Raghavan", email = "kshetrajna@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "transformers>=4.56",
    "accelerate>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.26",
    "datasets>=3.0",
    "peft>=0.13",
    "httpx>=0.27",
    "safetensors>=0.4",
    "torchvision>=0.24",
    "pillow>=10",
    "flash-linear-attention>=0.5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
optimize = ["gepa>=0.1.4"]

[project.scripts]
reflex-serve = "reflex.server:main"
reflex-eval-mmlu = "reflex.eval.mmlu:main"
reflex-calibrate = "reflex.train.calibrate:main"
reflex-data = "reflex.train.recipes:main"
reflex-publish-adapter = "reflex.publish:main"
reflex-distill = "reflex.distill.cli:main"
reflex-optimize = "reflex.optimize_prompt:main"
reflex-escalate = "reflex.escalate:main"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
